# HawkEye — default configuration
# Everything the pipeline needs. Override with --config <file> or env HAWKEYE_CONFIG.
name: HawkEye

ingest:
  source: "0"          # "0"=default webcam, a path to a video file, or an IP-cam URL (http://phone-ip:8080/video)
  width: 960
  height: 540
  target_fps: 25       # smooth real-time processing

detect:
  device: "auto"       # auto -> mps on Mac, cuda on the 3050, else cpu
  pose_model: "yolo11n-pose.pt"    # auto-downloaded by ultralytics on first run
  person_conf: 0.35
  # Trained YOLO for guns/knives (see docs/training.md). Empty = disabled.
  # No weights ship with the repo — train your own with scripts/train_weapon.py
  # and point this at the result, e.g. "models/weapons.pt".
  weapon_model: "models/weapons.pt"
  weapon_conf: 0.68
  # Reject oversized bounding boxes taking more than 15% of frame (cars, walls, fans)
  weapon_max_area_ratio: 0.15
  # Suppress floating weapons when no person is holding or standing near the object
  weapon_require_person: true
  # Require weapon detection across N consecutive ticks before triggering
  weapon_hysteresis_hits: 3
  # Class-label filter for weapon detections. Empty => use the built-in keyword
  # list in detect/weapons.py (guns AND knives), matched on token boundaries.
  # Narrow this ONLY after reading the per-class mAP50 of your own trained model
  # (scripts/train_weapon.py prints it) — do not carry over another run's list.
  weapon_labels: []
  # Trained action classifier (violence/fall/normal) from scripts/train_action.py.
  # When set + present, it REPLACES the zero-training heuristics. Empty = heuristics.
  # No weights ship with the repo — train your own (see docs/training.md) and
  # point this at the result, e.g. "models/action_gru.pt".
  action_model: "models/action_gru.pt"
  # Fallback confidence floor only. A trained checkpoint carries per-class
  # thresholds fitted on validation data at a target precision, and those win.
  action_min_conf: 0.50                  # lowered from 0.60 — fallback floor for classes without a checkpoint threshold
  # Suppress VIOLENCE when 2+ people are close/overlapping but scene motion is
  # below this and nobody has an aggressive (wrists-raised) pose -- fixes the
  # "two calm people standing near the camera" false-positive. Same 0-1 scale
  # as scene motion energy; raise if still too trigger-happy, lower if real
  # fights with little visible motion get missed.
  violence_motion_min: 0.08              # lowered from 0.12 — catches calmer violence (grappling, choking)
  action_stride: 2
  # A class must clear its threshold on `hits` of the last `window` inference
  # ticks before it is reported. Raise `hits` if you still see brief flickers;
  # lower it if genuine short events (a single hard shove) are being missed.
  action_hysteresis_window: 3
  action_hysteresis_hits: 2
  trigger_threshold: 0.58           # raised from 0.50 — prevents low-confidence noise from flooding incidents
  motion_weight: 0.35               # how much scene-motion contributes to the fused score
  clip_seconds: 3.0                 # length of evidence/reasoning clip buffer
  cooldown_seconds: 30.0            # min gap (seconds) between triggers for the same anomaly type (stops duplicate clutter)

reason:
  backend: "auto"      # auto | claude | moondream | mock  (auto: claude if key else mock)
  # Cost note: Stage B fires only on triggers. claude-opus-4-8 gives the best
  # explanations (the USP). For a very high-frequency / cost-sensitive deployment,
  # claude-sonnet-5 ($3/$15) or claude-haiku-4-5 ($1/$5) are cheaper alternatives.
  claude_model: "claude-opus-4-8"
  api_key_env: "ANTHROPIC_API_KEY"
  max_frames: 6        # frames sampled from the clip and sent to the VLM
  moondream_model: "vikhyatk/moondream2"

identity:
  enabled: true
  match_threshold: 0.42            # cosine similarity above which a face is "known"
  model_name: "buffalo_l"          # InsightFace pack: RetinaFace + ArcFace (512-d)
  det_size: 640
  attendance_enabled: true         # continuously log enrolled members seen on camera
  attendance_interval_sec: 3.0     # scan cadence (seconds) — cheap, runs off the hot path

decision:
  confidence_min: 0.5              # ignore incidents below this reasoning confidence
  cooldown_seconds: 20.0           # per action-type dispatch cooldown
  # (anomaly_type -> action). Types come from Stage A / Stage B.
  rules:
    violence: police
    robbery: police
    theft: police
    weapon: police
    intrusion: police
    fall: ambulance
    medical: ambulance
    accident: ambulance
    fire: fire
    unknown: none
  # severity floor required to actually dispatch (below -> log only)
  dispatch_min_severity: "medium"  # low | medium | high | critical
  dispatchers: ["log"]             # log | webhook  (webhook needs decision.webhook_url)
  webhook_url: ""

storage:
  db_path: "data/hawkeye.db"
  evidence_dir: "data/evidence"

server:
  host: "127.0.0.1"
  port: 8000
